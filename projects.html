<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | K2 Architects</title>
  <meta name="description" content="Portfolio of schools, colleges, hospitals, hostels, residential towers, bungalows and banquet halls designed by K2 Architects across central India.">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Muli:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/projects.css">
  <link rel="icon" type="image/png" href="images/logo1.png">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top" id="navbar" aria-label="Main Navigation">
    <div class="container-fluid">
      <a class="navbar-brand" style="margin-left:0px;" href="index.html">
        <img src="images/logo1.png" width="70" height="70" alt="K2 Architects - Home">
      </a>
      <button class="navbar-toggler" id="burger" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#about-us">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#team">Team</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="projects.html">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contactus.html">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <h1>Our Projects</h1>
    <div class="underline"></div>

    <!-- Category Buttons -->
    <div class="buttons" role="group" aria-label="Project categories">
      <button type="button" data-category="engineering" class="active" aria-pressed="true">Schools</button>
      <button type="button" data-category="residential" aria-pressed="false">Residential &amp; Commercial Tower</button>
      <button type="button" data-category="hostel" aria-pressed="false">Public Buildings (Hostel)</button>
      <button type="button" data-category="bungalow" aria-pressed="false">Bungalow, Farmhouse, Townships</button>
      <button type="button" data-category="banquets" aria-pressed="false">Banquets</button>
      <button type="button" data-category="medi" aria-pressed="false">Hospital &amp; Medi Complex</button>
      <button type="button" data-category="college" aria-pressed="false">College Campus</button>
    </div>

    <!-- Projects Grid -->
    <div id="projects-container" class="projects" aria-live="polite">
      <!-- Projects are injected here by js/projects.js -->
    </div>
  </main>

  <!-- Modal for Full-Screen Project Gallery -->
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" type="button" aria-label="Close gallery">&times;</button>

    <div class="modal-content-wrapper">
      <button class="modal-nav modal-prev" id="modal-prev" type="button" aria-label="Previous image">
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
      </button>

      <div class="modal-image-container">
        <img id="modal-image" src="" alt="">
        <div id="modal-counter" class="modal-counter" aria-hidden="true"></div>
      </div>

      <button class="modal-nav modal-next" id="modal-next" type="button" aria-label="Next image">
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
      </button>
    </div>

    <div class="modal-info">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <div id="modal-dots" class="modal-dots"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <p class="copyright">
        &copy; 2026 K2 Architects - All Rights Reserved<br>
        <a href="tel:+919422101718">9422101718</a> | <a href="mailto:ar8880@gmail.com">ar8880@gmail.com</a><br>
        101, Ozone Apartment, Puranik Layout, Bharat Nagar, Amravati Road, Nagpur
      </p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
