<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/projects.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
    <div class="container-fluid">
      <a class="navbar-brand" style="margin-left:0px;" href="index.html">
        <img src="images/logo1.png" width="70" height="70" alt="">
      </a>
      <button class="navbar-toggler" id="burger" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#about-us">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#team">Team</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="projects.html">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contactus.html">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main">
    <h1>Our Projects</h1>
    <div class="underline"></div>

    <!-- Category Buttons -->
    <div class="buttons">
      <button onclick="showProjects('engineering')" class="active">Schools</button>
      <button onclick="showProjects('residential')">Residential & Commercial Tower</button>
      <button onclick="showProjects('hostel')">Public Buildings (Hostel)</button>
      <button onclick="showProjects('bungalow')">Bungalow, Farmhouse, Townships</button>
      <button onclick="showProjects('banquets')">Banquets</button>
      <button onclick="showProjects('medi')">Hospital & Medi Complex</button>
      <button onclick="showProjects('college')">College Campus</button> <!-- New Button -->
    </div>
    

    <!-- Projects Grid -->
    <div id="projects-container" class="projects">
      <!-- Projects will be injected here dynamically -->
    </div>
  </div>

  <!-- Modal for Full-Screen Project Gallery -->
  <div id="modal" role="dialog" aria-modal="true" aria-label="Project Gallery">
    <button class="modal-close" id="modal-close" aria-label="Close gallery">&times;</button>
    
    <div class="modal-content-wrapper">
      <button class="modal-nav modal-prev" id="modal-prev" aria-label="Previous image">
        <i class="fas fa-chevron-left"></i>
      </button>

      <div class="modal-image-container">
        <img id="modal-image" src="" alt="Project Image">
        <div id="modal-counter" class="modal-counter"></div>
      </div>

      <button class="modal-nav modal-next" id="modal-next" aria-label="Next image">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>

    <div class="modal-info">
      <h3 id="modal-title"></h3>
      <p id="modal-desc"></p>
      <div id="modal-dots" class="modal-dots"></div>
    </div>
  </div>

  <!-- Footer -->
 
  <footer class="footer">
    <div class="footer-content">
      <p class="copyright">
        Copyright &copy; 2022, k2-Architect - All Rights Reserved
        <br>  9422101718 | ar8880@gmail.com
        <br> 101, Ozone Apartment, puranik layout,
        Bharat Nagar, Amravati road, Nagpur
      </p>
    </div>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
